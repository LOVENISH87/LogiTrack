version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-local
    privileged: true
    user: root # Needed to allow Jenkins to run Docker inside Docker (for your build steps)
    ports:
      - "8080:8080" # Jenkins web interface
      - "50000:50000" # Jenkins agents port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Allows Jenkins to build your Docker images
volumes:
  jenkins_home:
