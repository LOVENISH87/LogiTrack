services:
  # Backend-API
  backend:
    build: ./backend
    container_name: logitrack-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/logitrack
      - JWT_SECRET=supersecretkey_change_this_in_production
      - PORT=5000
      - MINIO_ENABLED=false
      - LOG_LEVEL=info
    depends_on:
      - mongodb
    networks:
      - logi-network

  # Frontend
  frontend:
    build: ./frontend
    container_name: logitrack-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - logi-network

  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: logitrack-db
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - logi-network

  # ── Monitoring: Grafana ──
  grafana:
    image: grafana/grafana:latest
    container_name: logitrack-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - logi-network

  # ── Logging: Loki ──
  loki:
    image: grafana/loki:latest
    container_name: logitrack-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - logi-network

  # ── Logging: Promtail ──
  promtail:
    image: grafana/promtail:latest
    container_name: logitrack-promtail
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - logi-network


networks:
  logi-network:
    driver: bridge

volumes:
  mongo-data:
  grafana-data:

